# Waiso for Easypanel (project → + Service → Compose → paste this file). The version below is rewritten by every release.
# Then: Environment = the values of env.example with Create .env file ON; Domains = three, one per address:
# ui port 8080, api port 3000, lsp port 3001 (compose service names). The editor address starts with ws:// or wss://.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: waiso
      POSTGRES_USER: waiso
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waiso -d waiso"]
      interval: 5s
      timeout: 3s
      retries: 20

  ui:
    image: ghcr.io/talissonjunior16/waiso-ui:${WAISO_VERSION:-1.8.7}
    restart: unless-stopped
    environment:
      WAISO_PUBLIC_API_URL: ${API_URL}
      WAISO_PUBLIC_LSP_URL: ${LSP_URL}
      WAISO_INTERNAL_API_URL: http://api:3000
      WAISO_APPS_DOMAIN: ${WAISO_APPS_DOMAIN}
    expose: ["8080"]
    depends_on: [api]

  api:
    image: ghcr.io/talissonjunior16/waiso-api:${WAISO_VERSION:-1.8.7}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://waiso:${POSTGRES_PASSWORD}@postgres:5432/waiso
      PORT: "3000"
      WAISO_VERSION: ${WAISO_VERSION:-1.8.7}
      WAISO_UPDATE_CHECK: ${WAISO_UPDATE_CHECK}
      DB_CREDENTIALS_KEY: ${DB_CREDENTIALS_KEY}
      SCRAPER_ENGINE_SECRET: ${SCRAPER_ENGINE_SECRET}
      FRONTEND_URL: ${UI_URL}
      WAISO_PUBLIC_LSP_URL: ${LSP_URL}
      WAISO_PUBLIC_API_URL: ${API_URL}
      WAISO_APPS_DOMAIN: ${WAISO_APPS_DOMAIN}
      WAISO_SITES_DIR: /data/sites
    volumes:
      - sites:/data/sites
    expose: ["3000"]
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    image: ghcr.io/talissonjunior16/waiso-worker:${WAISO_VERSION:-1.8.7}
    # 1.8.7 — a stop (docker stop / compose up with a new image) lets running steps finish first.
    stop_grace_period: 2m
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: postgres://waiso:${POSTGRES_PASSWORD}@postgres:5432/waiso
      DB_CREDENTIALS_KEY: ${DB_CREDENTIALS_KEY}
      WORKER_POOL: default
      WAISO_PUBLIC_API_URL: ${API_URL}
      FRONTEND_URL: ${UI_URL}
      WORKER_CONCURRENCY: "12"
      MEM_LIMIT_MB: "2048"
      ISOLATION_LEVEL: sandbox
      WAISO_NATIVE_CACHE_DIR: /var/cache/waiso/native
      WAISO_API_URL: http://api:3000
      SCRAPER_ENGINE_SECRET: ${SCRAPER_ENGINE_SECRET}
    volumes:
      - native_cache:/var/cache/waiso/native
    # Each script runs in its own sandbox with no network; these let the worker build it.
    # A panel cannot install the AppArmor profile the plain compose install uses, so AppArmor is left unconfined here.
    cap_add: [SYS_ADMIN, NET_ADMIN]
    security_opt: ["seccomp=unconfined", "apparmor=unconfined"]
    mem_limit: 2g
    pids_limit: 512
    depends_on:
      postgres:
        condition: service_healthy

  scraper-engine:
    image: ghcr.io/talissonjunior16/waiso-scraper-engine:${WAISO_VERSION:-1.8.7}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://waiso:${POSTGRES_PASSWORD}@postgres:5432/waiso
      DB_CREDENTIALS_KEY: ${DB_CREDENTIALS_KEY}
      SCRAPER_CHROMIUM_PATH: /usr/bin/chromium
      WAISO_API_URL: http://api:3000
      SCRAPER_ENGINE_SECRET: ${SCRAPER_ENGINE_SECRET}
    cap_add: [NET_ADMIN]
    shm_size: 1gb
    depends_on:
      postgres:
        condition: service_healthy

  lsp:
    image: ghcr.io/talissonjunior16/waiso-lsp:${WAISO_VERSION:-1.8.7}
    restart: unless-stopped
    environment:
      PORT: "3001"
      WAISO_API_URL: http://api:3000
    expose: ["3001"]

volumes:
  pgdata:
  native_cache:
  sites:
