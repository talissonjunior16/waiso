{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "waiso.serviceAccountName" . }}
  labels:
    {{- include "waiso.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Waiso talks to PostgreSQL, not to the Kubernetes API. No Role, no
# RoleBinding, and no token it would have no use for.
automountServiceAccountToken: false
{{- end }}
