{{/*
The API. It applies database migrations on startup; the strategy below starts a
new pod before retiring the old one so the service stays up during a rollout.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "waiso.fullname" . }}-api
  labels:
    {{- include "waiso.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "waiso.selector" (dict "ctx" $ "component" "api") | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "waiso.selector" (dict "ctx" $ "component" "api") | nindent 8 }}
      {{- with .Values.api.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "waiso.serviceAccountName" . }}
      {{- include "waiso.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          image: {{ include "waiso.image" (dict "ctx" $ "component" "api" "svc" .Values.api) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.api.service.port }}
          env:
            {{- include "waiso.commonEnv" . | nindent 12 }}
            {{- include "waiso.scraperSecretEnv" . | nindent 12 }}
            - name: PORT
              value: {{ .Values.api.service.port | quote }}
            # Where links in emails and sign-in redirects send people.
            - name: FRONTEND_URL
              value: {{ include "waiso.publicUrl" (dict "ctx" $ "svc" "ui" "scheme" "http" "port" .Values.ui.service.port) | quote }}
            {{- range $k, $v := .Values.api.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6
          # A first boot on an empty database has migrations to apply.
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 60
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      {{- include "waiso.scheduling" .Values.api | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "waiso.fullname" . }}-api
  labels:
    {{- include "waiso.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "waiso.selector" (dict "ctx" $ "component" "api") | nindent 4 }}
