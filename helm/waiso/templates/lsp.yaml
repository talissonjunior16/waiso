{{- if .Values.lsp.enabled }}
{{/*
Completions and diagnostics in the code editor. Everything else works without
it; the editor just stops suggesting.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "waiso.fullname" . }}-lsp
  labels:
    {{- include "waiso.labels" . | nindent 4 }}
    app.kubernetes.io/component: lsp
spec:
  replicas: {{ .Values.lsp.replicaCount }}
  selector:
    matchLabels:
      {{- include "waiso.selector" (dict "ctx" $ "component" "lsp") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "waiso.selector" (dict "ctx" $ "component" "lsp") | nindent 8 }}
      {{- with .Values.lsp.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "waiso.serviceAccountName" . }}
      {{- include "waiso.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: lsp
          image: {{ include "waiso.image" (dict "ctx" $ "component" "lsp" "svc" .Values.lsp) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.lsp.service.port }}
          env:
            - name: PORT
              value: {{ .Values.lsp.service.port | quote }}
          readinessProbe:
            tcpSocket: { port: http }
            periodSeconds: 10
          resources:
            {{- toYaml .Values.lsp.resources | nindent 12 }}
      {{- include "waiso.scheduling" .Values.lsp | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "waiso.fullname" . }}-lsp
  labels:
    {{- include "waiso.labels" . | nindent 4 }}
    app.kubernetes.io/component: lsp
spec:
  type: {{ .Values.lsp.service.type }}
  ports:
    - port: {{ .Values.lsp.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "waiso.selector" (dict "ctx" $ "component" "lsp") | nindent 4 }}
{{- end }}
