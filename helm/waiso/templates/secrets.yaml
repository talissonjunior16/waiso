{{/*
Chart-owned Secrets, created ONLY when you did not bring your own. The inline
values exist so an evaluation installs in one line; a value passed with --set is
recorded in the release and readable with `helm get values`.
*/}}
{{- if and (not .Values.postgres.existingSecret) .Values.postgres.url }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "waiso.fullname" . }}-db
  labels:
    {{- include "waiso.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.postgres.existingSecretKey }}: {{ .Values.postgres.url | quote }}
---
{{- end }}
{{- if and (not .Values.credentials.existingSecret) (or .Values.credentials.dbCredentialsKey .Values.credentials.scraperEngineSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "waiso.fullname" . }}-secrets
  labels:
    {{- include "waiso.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.credentials.dbCredentialsKey }}
  {{ $.Values.credentials.existingSecretKey }}: {{ . | quote }}
  {{- end }}
  {{- with .Values.credentials.scraperEngineSecret }}
  {{ $.Values.credentials.scraperSecretKey }}: {{ . | quote }}
  {{- end }}
{{- end }}
