{{- if .Values.imageWorker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "waiso.fullname" . }}-image-worker
  labels:
    {{- include "waiso.labels" . | nindent 4 }}
    app.kubernetes.io/component: image-worker
spec:
  replicas: {{ .Values.imageWorker.replicaCount }}
  selector:
    matchLabels:
      {{- include "waiso.selector" (dict "ctx" $ "component" "image-worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "waiso.selector" (dict "ctx" $ "component" "image-worker") | nindent 8 }}
      {{- with .Values.imageWorker.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "waiso.serviceAccountName" . }}
      {{- include "waiso.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: image-worker
          image: {{ include "waiso.image" (dict "ctx" $ "component" "worker-image" "svc" .Values.imageWorker) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            {{- include "waiso.commonEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.imageWorker.resources | nindent 12 }}
      {{- include "waiso.scheduling" .Values.imageWorker | nindent 6 }}
{{- end }}
